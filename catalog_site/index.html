<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог BeamNG Mod Installer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0d0d0e;
    color: #f2f2f3;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  main { width: min(680px, calc(100% - 40px)); }
  .brand {
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #8a8b90;
    margin-bottom: 26px;
  }
  .brand b { color: #e5122a; font-weight: 700; }
  h1 { font-size: clamp(28px, 5vw, 42px); margin: 0 0 12px; letter-spacing: -.02em; }
  p { color: #a7a8ad; line-height: 1.6; margin: 0 0 26px; }
  .stats { display: flex; gap: 12px; margin-bottom: 26px; }
  .stat {
    flex: 1;
    background: #151517;
    border: 1px solid #242427;
    border-radius: 10px;
    padding: 18px 20px;
  }
  .stat b { display: block; font-size: 26px; margin-bottom: 4px; }
  .stat span { font-size: 12px; color: #85868b; }
  .btn {
    display: inline-block;
    background: #b3121f;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 8px;
  }
  .note { font-size: 12px; color: #66676c; margin: 24px 0 0; }
</style>
</head>
<body>
<main>
  <div class="brand">BeamNG <b>Mod Installer</b></div>
  <h1>Каталог модов</h1>
  <p>Автоматически обновляемый каталог машин и карт с ModLand. Приложение получает этот файл без выпуска новой версии.</p>
  <div class="stats">
    <div class="stat"><b id="count">—</b><span>модов в каталоге</span></div>
    <div class="stat"><b id="version">—</b><span>версия каталога</span></div>
  </div>
  <a class="btn" href="catalog.json">Открыть catalog.json</a>
  <p class="note">Обновление каждые 6 часов. Целостность проверяется по SHA-256.</p>
</main>
<script>
  fetch("catalog.json", { cache: "no-store" })
    .then(response => response.json())
    .then(data => {
      document.getElementById("count").textContent = (data.mods || []).length;
      document.getElementById("version").textContent = data.version || data.generatedAt || "—";
    })
    .catch(() => {
      document.getElementById("version").textContent = "нет данных";
    });
</script>
</body>
</html>
